<!-- PER-APP PAGE TEMPLATE. Copy to <app>.html and fill the {{...}} slots.
     Same CSS block as index.html on purpose: four copies of 40 lines of CSS is
     cheaper than a stylesheet request, keeps every page standalone, and means a
     page still renders correctly if opened straight off disk. -->
<title>ClipPick — Six Finger Software</title>
<meta name="description" content="Grab any recent clipboard item or screenshot from the menu bar.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;  --fg: #1b1b1b;  --dim: #6a6a6a;
    --rule: #e3e3e0; --card: #ffffff; --accent: #2f5d50;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a; --fg: #e6e6e4; --dim: #9a9a97;
      --rule: #2a2d30; --card: #1d2023; --accent: #7fb8a4;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    max-width: 42rem; margin: 0 auto; padding: 2rem 1.25rem 5rem;
  }
  a { color: var(--accent); }
  .back { font-size: 0.9rem; }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 1.5rem 0 0.3rem; letter-spacing: -0.01em; }
  .sub { color: var(--dim); }
  .dl {
    display: inline-block; margin: 1.5rem 0 0.4rem; padding: 0.7rem 1.2rem;
    background: var(--accent); color: var(--bg); text-decoration: none;
    border-radius: 7px; font-weight: 600;
  }
  .meta { color: var(--dim); font-size: 0.85rem; }
  h2 { font-size: 1rem; font-weight: 600; margin: 2rem 0 0.5rem; }
  ul { margin-left: 1.1rem; }
  li { margin: 0.25rem 0; }
  footer {
    margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--rule);
    color: var(--dim); font-size: 0.85rem;
  }
</style>
</head>
<body>

<p class="back"><a href="./">&larr; Six Finger Software</a></p>

<h1>ClipPick</h1>
<p class="sub">Grab any recent clipboard item or screenshot from the menu bar.</p>
